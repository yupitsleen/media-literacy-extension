<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      width: 380px;
      min-height: 250px;
    }
  </style>
</head>
<body>
  <div class="container-fluid p-3">
    <div class="d-flex align-items-center mb-3">
      <h5 class="mb-0 fw-bold">Media Literacy Extension</h5>
    </div>
    
    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" id="enableExtension" checked>
      <label class="form-check-label" for="enableExtension">
        Enable Extension
      </label>
    </div>
    
    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" id="enableFallacyDetection" checked>
      <label class="form-check-label" for="enableFallacyDetection">
        Detect Logical Fallacies
      </label>
    </div>
    
    <div id="status" class="alert alert-info py-2 mb-3" role="alert">
      <small class="mb-0">Ready to analyze content for logical fallacies</small>
    </div>
    
    <div id="fallacyStats" class="d-none mb-3">
      <small class="text-muted">
        <strong>Fallacies Detected:</strong> <span id="fallacyCount">0</span>
      </small>
    </div>
    
    <details class="mb-0">
      <summary style="cursor: pointer; font-size: 14px; margin-bottom: 10px;">
        Configure Fallacy Types
      </summary>
      <div id="fallacyToggles" style="max-height: 200px; overflow-y: auto; margin-left: 10px;">
        <!-- Fallacy toggles will be populated by JavaScript -->
      </div>
    </details>
  </div>
  
  <script src="../../build/popup/popup.js"></script>
</body>
</html>
