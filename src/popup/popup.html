<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      width: 350px;
      min-height: 200px;
    }
  </style>
</head>
<body>
  <div class="container-fluid p-3">
    <div class="d-flex align-items-center mb-3">
      <h5 class="mb-0 fw-bold">Media Literacy Extension</h5>
    </div>
    
    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" id="enableExtension" checked>
      <label class="form-check-label" for="enableExtension">
        Enable Extension
      </label>
    </div>
    
    <div class="alert alert-info py-2 mb-0" role="alert">
      <small class="mb-0">Ready to analyze content for logical fallacies</small>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
